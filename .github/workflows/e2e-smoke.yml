name: E2E Smoke Tests

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: "Branch do backend (opcional)"
        required: false
        default: "main"

jobs:
  smoke:
    name: Playwright Smoke Narrative Against Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Full Stack with Docker Compose
        run: |
          docker compose up -d --build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3001

      - name: Wait for Frontend & API Health
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:3001 > /dev/null; do sleep 2; done' || exit 1

      - name: Run E2E Smoke Tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Containers
        if: always()
        run: docker compose down
